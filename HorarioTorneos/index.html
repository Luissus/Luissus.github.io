<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Resultados de Partidos</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1 { color: #333; }
    ul { list-style-type: none; padding: 0; }
    li { padding: 5px 0; border-bottom: 1px solid #ccc; }
    button { padding: 10px 15px; margin: 5px; cursor: pointer; }
    #adminForm { display: none; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Resultados de Partidos</h1>

  <table id="tablaResultados">
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Hora</th>
      <th>Resultado</th>
      <th>Clasificacion</th>
    </tr>
  </thead>
  <tbody id="tablaBody"></tbody>
</table>

  <button id="btnLogin">Iniciar sesión administrador</button>

  <div id="adminForm">
    <h2>Agregar resultado</h2>
    <input type="text" id="partido" placeholder="Partido">
    <input type="text" id="hora" placeholder="Hora a la que se jugo">
    <input type="text" id="resultado" placeholder="Resultado partido">
    <input type="number" id="clasificacion" placeholder="Clasificacion">
    <button id="btnAgregar">Agregar</button>
  </div>

  <!-- Firebase clásico compat -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js.js"></script>
</body>
</html>
