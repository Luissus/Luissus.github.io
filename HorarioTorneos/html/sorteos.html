<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sorteos</title>
  <link rel="stylesheet" href="../css/sorteos.css" />
  <link rel="icon" href="../imagenes/logo.jpg" type="image/jpeg">
</head>
<body>
  <div id="header"></div>
  <script>
    fetch("header.html")
      .then(response => response.text())
      .then(data => {
        document.getElementById("header").innerHTML = data;
      });
  </script>

<main class="layout">
  <section class="left-box">
    <h2>Sorteos</h2>
    <table id="">
      <thead>
        <tr>
          <th>Sorteo</th>
          <th>Día sorteo</th>
          <th>Hora de sorteo</th>
          <th>Número ganador</th>
        </tr>
      </thead>
      <tbody id="tablaSorteos"></tbody>
    </table>
  </section>

  <!-- Sección opcional de clasificaciones -->

  <section class="right-box">
    <h2>Clasificaciones</h2>
    <table id="tablaClasificaciones">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Categoria</th>
          <th>Puntuacion</th>
        </tr>
      </thead>
      <tbody id="tablaClasificacionesBody"></tbody>
    </table>
  </section>
  -->
</main>

  <!-- Firebase clásico compat -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../js/sorteos.js"></script>
</body>
</html>
