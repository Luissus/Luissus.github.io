<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Resultados de Partidos</title>
  <link rel="stylesheet" href="../css/partidos-clasificaciones.css" />
  <link rel="icon" href="../imagenes/logo.jpg" type="image/jpeg">
</head>
<body>
  <header class="header">
<img src="../imagenes/logo.jpg" alt="Imagen izquierda" class="side-img" />
<h1>Torneo Noja</h1>
<img src="../imagenes/logo.jpg" alt="Imagen derecha" class="side-img" />
</header>

  <main class="layout">
  <section class="left-box">
  <h2>Resultados de Partidos</h2>

  <table id="tablaResultados">
  <thead>
    <tr>
      <th>Nombre equipo</th>
      <th>Nombre equipo</th>
      <th>Hora</th>
      <th>Goles Visitante</th>
      <th>Goles Local</th>
    </tr>
  </thead>
  <tbody id="tablaBody"></tbody>
  </table>
  </section>

<section class="right-box">
<h2>Clasificaciones</h2>

  <table id="tablaClasificaciones">
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Categoria</th>
      <th>Puntuacion</th>
    </tr>
  </thead>
  <tbody id="tablaClasificacionesBody"></tbody>
  </table>

</section>
</main>

  <!-- Firebase clásico compat -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../js/partidos-clasificaciones.js"></script>
</body>
</html>
