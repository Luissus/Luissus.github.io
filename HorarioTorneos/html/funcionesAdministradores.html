<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador</title>
    <link rel="stylesheet" href="../css/funcionesAdministrador.css">
    <link rel="icon" href="../imagenes/logo.jpg" type="image/jpeg">
</head>
<body>

<header>
  <img src="../imagenes/logo.jpg" alt="Logo izquierda">
  <h1>Torneo Noja</h1>
  
  <img src="../imagenes/logo.jpg" alt="Logo derecha">
</header> 
<h1>Panel de Administración</h1>




<div class="menu">

  <!--#region Partidos-->

    <button class="menu-btn">Partidos</button>
    <div class="menu-options">
        <button class="option-btn">Agregar partido</button>
        <div class="option-content">
            <h3>Agregar resultado</h3>
            <select id="selectNombreEquipoLocal">
                <option value="">--Seleccione un equipo--</option>
            </select>
            <select id="selectNombreEquipoVisitante">
                <option value="">--Seleccione un equipo--</option>
            </select>
            <input type="time" id="hora">
            <input type="number" id="golesEquipoLocal" placeholder="Goles equipo local">
            <input type="number" id="golesEquipoVisitante" placeholder="Goles equipo visitante">
            <button id="btnAgregar">Agregar</button>
        </div>

        <button class="option-btn">Modificar resultado</button>
        <div class="option-content">
          <select id="selectPartidos">
            <option value="">--Selecciona un partido--</option>
          </select>
          <input type="number" id="golesEquipoLocalModificar" placeholder="Goles equipo local">
          <input type="number" id="golesEquipoVisitanteModificar" placeholder="Goles equipo visitante">
          <button id="btnModificarPartido">Modificar</button>
        </div>

        <button class="option-btn">Eliminar partido</button>
        <div class="option-content">
          <select id="selectPartidosEliminar">
            <option value="">--Selecciona un partido</option>
          </select>
          <button id="btnEliminarPartido">Eliminar partido</button>
        </div>
    </div>

  <!--#endregion-->
    
  <!--#region Categorias-->

    <button class="menu-btn">Categorías</button>
    <div class="menu-options">
        <button class="option-btn">Agregar categoría</button>
        <div class="option-content">
            <input type="text" id="categoriaEquipo" placeholder="Nueva categoría">
            <button id="btnNuevaCategoria">Agregar categoría</button>
        </div>

        <button class="option-btn">Eliminar categoría</button>
        <div class="option-content">
            <select id="selectCategoriasEliminar">
                <option value="">--Selecciona una--</option>
            </select>
            <button id="btnEliminarCategoria">Eliminar categoría</button>
        </div>
    </div>

  <!--#endregion-->
   
  <!--#region Equipos-->
  
    <button class="menu-btn">Equipos</button>
    <div class="menu-options">
        <button class="option-btn">Sumar puntos equipo</button>
        <div class="option-content">
          <select id="selectEquiposSumarPuntos">
            <option value="">--Selecciona un equipo--</option>
          </select>
          <input type="number" id="puntuacionSumarEquipo">
          <button id="btnSumarPuntuacionEquipo">Sumar puntos</button>
        </div>

        <button class="option-btn">Restar puntos equipo</button>
        <div class="option-content">
          <select id="selectEquiposRestarPuntos">
            <option value="">--Selecciona un equipo--</option>
          </select>
          <input type="number" id="puntuacionRestarEquipo">
          <button id="btnRestarPuntuacionEquipo">Restar puntos</button>
        </div>

        <button class="option-btn">Añadir equipo</button>
        <div class="option-content">
            <input type="text" id="nombreEquipo" placeholder="Nombre del equipo">
            <select id="selectCategoriasEquipo">
                <option value="">--Selecciona un equipo--</option>
            </select>
            <button id="btnAgregarEquipo">Agregar equipo</button>
        </div>

        <button class="option-btn">Eliminar equipo</button>
        <div class="option-content">
            <select id="selectEquipos">
                <option value="">--Selecciona un equipo--</option>
            </select>
            <button id="btnEliminarEquipo">Eliminar equipo</button>
        </div>
    </div>

  <!-- #endregion -->

  <!--#region Sorteos-->

    <button class="menu-btn">Sorteos</button>
    <div class="menu-options">
      
      <button class="option-btn">Agregar sorteo</button>
      <div class="option-content">
        <input type="text" id="nombreSorteoAgregar">
        <input type="datetime-local" id="fechaHoraSorteo">
        <button id="btnAgregarSorteo">Agregar sorteo</button>
      </div>

      <button class="option-btn">Numero ganador</button>
      <div class="option-content">
        <select id="selectNumeroGanadorSorteo">
          <option value="">--Selecciona un sorteo--</option>
        </select>
        <input type="number" id="numeroGanadorSorteo">
        <button id="btnNumeroGanadorSorteo">Numero ganador</button>
      </div>

      <button class="option-btn">Eliminar sorteo</button>
      <div class="option-content">
        <select id="selectSorteoEliminar">
          <option value="">--Selecciona un sorteo--</option>
        </select>
        <button id="btnEliminarSorteo">Eliminar sorteo</button>
      </div>
    </div>

    

  <!-- #endregion -->

</div>

<div class="botonesAcceso">
  <a href="../html/partidos-clasificaciones.html">
    <button class="accesoPaginas">Partidos Clasificaciones</button>
  </a>
  <a href="../html/sorteos.html">
    <button class="accesoPaginas">Sorteos</button>
  </a>
</div>
<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script src="../js/funcionesAdministradores.js"></script>


</body>
</html>
