<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cifrado César</title>
    <link rel="stylesheet" href="css.css">
</head>
<body>
    <div class="container">
        <input type="text" id="textoCifrar" placeholder="Escribe el texto a cifrar">
        <input type="text" id="resultadoCifrado" placeholder="Resultado Cifrado" readonly>
        <button id="funcionCifrar">Cifrar</button>
    </div>

    <div class="container">
        <input type="text" id="textoDescifrar" placeholder="Escribe el texto a descrifrar">
        <input type="text" id="resultadoDescifrado" placeholder="Resultado Descifrado" readonly>
        <button id="funcionDescifrar">Descifrar</button>
    </div>


    <script src="js.js" defer></script>
</body>
</html>
